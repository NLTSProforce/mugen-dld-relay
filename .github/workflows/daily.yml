name: Daily DLD data pull

on:
  schedule:
    # 03:30 UTC = 07:30 Gulf Standard Time, ~45 min before the Claude task fires
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date to fetch (YYYY-MM-DD), e.g. 2026-07-24 for validation"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch DLD open data and compute KPIs
        run: python fetch_dld.py ${{ github.event.inputs.date }}

      - name: Commit data
        run: |
          git config user.name "dld-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "DLD data $(date -u +%F)"
          git push
